<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issues Tracker</title>
    <!-- Daisy UI and Tailwind -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="bg-white shadow px-20 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <img src="./assets/github-logo.png" class="w-6" />
        <h1 class="font-semibold text-lg">GitHub Issues Tracker</h1>
      </div>

      <div class="flex gap-3">
        <input
          type="text"
          placeholder="Search issues..."
          class="input input-bordered input-sm w-64"
        />
        <button class="btn btn-primary btn-sm">+ New Issue</button>
      </div>
    </nav>

    <main>
      <!-- Tabs Section -->
      <div class="flex gap-2 mb-4">
        <button class="btn btn-sm btn-primary">All</button>
        <button class="btn btn-sm btn-outline">Open</button>
        <button class="btn btn-sm btn-outline">Closed</button>
      </div>

      
      
    </main>
  </body>
</html>
