<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issues Tracker</title>
    <!-- Daisy UI and Tailwind -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="bg-white shadow px-20 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <img src="./assets/github-logo.png" class="w-6" />
        <h1 class="font-semibold text-lg">GitHub Issues Tracker</h1>
      </div>

      <div class="flex gap-3">
        <input
          type="text"
          placeholder="Search issues..."
          class="input input-bordered input-sm w-64"
        />
        <button class="btn btn-primary btn-sm">+ New Issue</button>
      </div>
    </nav>

    <main>
      <!-- Tabs Section -->
      <div class="flex gap-2 mb-4">
        <button class="btn btn-sm btn-primary">All</button>
        <button class="btn btn-sm btn-outline">Open</button>
        <button class="btn btn-sm btn-outline">Closed</button>
      </div>

      <!-- Issues -->
      <div
        class="flex justify-between items-center bg-white p-4 rounded shadow mb-6"
      >
        <div>
          <h2 id="issueCount" class="font-semibold text-lg">Issues</h2>
          <p class="text-sm text-gray-500">
            Track and manage your project issues
          </p>
        </div>

        <div class="flex gap-4 text-sm">
          <span class="text-green-500">● Open</span>
          <span class="text-purple-500">● Closed</span>
        </div>
      </div>

      <!-- Loading-->
      <div id="loading" class="text-center hidden">
        <span class="loading loading-spinner loading-lg"></span>
      </div>

      <!-- ISSUE GRID -->

      <div
        id="issuesContainer"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"
      ></div>

      <!-- Model -->
      <dialog id="issueModal" class="modal">
        <div class="modal-box">
          <h3 id="modalTitle" class="font-bold text-lg mb-2"></h3>

          <p id="modalDescription" class="text-sm text-gray-600 mb-3"></p>

          <div class="mb-2">
            <strong>Status:</strong>
            <span id="modalStatus"></span>
          </div>

          <div class="mb-2">
            <strong>Author:</strong>
            <span id="modalAuthor"></span>
          </div>

          <div class="mb-2">
            <strong>Priority:</strong>
            <span id="modalPriority"></span>
          </div>

          <div class="mb-2">
            <strong>Created:</strong>
            <span id="modalCreated"></span>
          </div>

          <div class="modal-action">
            <form method="dialog">
              <button class="btn">Close</button>
            </form>
          </div>
        </div>
      </dialog>
    </main>

    <script src="./issues.js"></script>
  </body>
</html>
