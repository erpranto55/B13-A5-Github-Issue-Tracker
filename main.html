<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issues Tracker</title>
    <!-- Daisy UI and Tailwind -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="bg-white shadow px-20 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <img src="./assets/github-logo.png" class="w-6" />
        <h1 class="font-semibold text-lg">GitHub Issues Tracker</h1>
      </div>

      <div class="flex gap-3">
        <input
          id="searchInput"
          type="text"
          placeholder=" Search issues..."
          class="input input-bordered input-sm w-64"
        />
        <button onclick="searchIssues()" class="btn btn-primary btn-sm">
          + New Issue
        </button>
      </div>
    </nav>

    <main class="max-w-[80%] mx-auto my-[60px]">
      <!-- Tabs Section -->
      <div class="flex gap-3 mb-6">
        <button
          id="allTab"
          onclick="filterIssues('all')"
          class="btn btn-sm bg-purple-600 text-white border-none"
        >
          All
        </button>

        <button
          id="openTab"
          onclick="filterIssues('open')"
          class="btn btn-sm btn-outline"
        >
          Open
        </button>

        <button
          id="closedTab"
          onclick="filterIssues('closed')"
          class="btn btn-sm btn-outline"
        >
          Closed
        </button>
      </div>

      <!-- Issues -->
      <div
        class="flex justify-between items-center bg-white p-5 rounded shadow mb-6"
      >
        <div class="flex gap-2.5">
          <img src="./assets/Aperture.png" alt=""  class="w-[50px] h-[50px] p-2.5 rounded-[100%] bg-[#ECE4FF] "/>
          <div class="grid grid-cols-1 ">
            <h2 id="issueCount" class="font-semibold text-lg">Issues</h2>
            <p class="text-sm text-gray-500">
              Track and manage your project issues
            </p>
          </div>
        </div>

        <div class="flex gap-4 text-sm">
          <span class="text-green-500">● Open</span>
          <span class="text-purple-500">● Closed</span>
        </div>
      </div>

      <!-- Loading-->
      <div id="loading" class="text-center hidden">
        <span class="loading loading-spinner loading-lg"></span>
      </div>

      <!-- ISSUE GRID -->

      <div
        id="issuesContainer"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"
      ></div>

      <!-- Model -->
      <dialog id="issueModal" class="modal">
        <div class="modal-box max-w-xl">
          <!-- Title -->
          <h3 id="modalTitle" class="font-bold text-lg mb-2"></h3>

          <!-- Status + Author + Date -->
          <div class="flex items-center gap-2 text-sm mb-3">
            <span
              id="modalStatus"
              class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-600"
            >
            </span>

            <span class="text-gray-500">
              • Opened by
              <span id="modalAuthor"></span>
            </span>

            <span class="text-gray-400">
              • <span id="modalCreated"></span>
            </span>
          </div>

          <!-- Labels -->
          <div class="flex gap-2 mb-3 text-xs">
            <span class="px-2 py-1 rounded-full bg-red-100 text-red-500">
              BUG
            </span>

            <span class="px-2 py-1 rounded-full bg-yellow-100 text-yellow-600">
              HELP WANTED
            </span>
          </div>

          <!-- Description -->
          <p id="modalDescription" class="text-sm text-gray-600 mb-5"></p>

          <!-- Assignee + Priority -->
          <div class="bg-gray-100 p-4 rounded-lg flex gap-[40%] text-sm">
            <div>
              <p class="text-gray-500">Assignee:</p>
              <p id="modalAssignee" class="font-medium"></p>
            </div>

            <div class="flex flex-col justify-center">
              <p class="text-gray-500">Priority:</p>
              <span
                id="modalPriority"
                class="px-3 py-1 text-xs rounded-full bg-red-500 text-white mt-1"
              ></span>
            </div>
          </div>

          <!-- Close Button -->
          <div class="modal-action">
            <form method="dialog">
              <button class="btn bg-purple-600 text-white border-none">
                Close
              </button>
            </form>
          </div>
        </div>
      </dialog>
    </main>

    <script src="./issues.js"></script>
  </body>
</html>
