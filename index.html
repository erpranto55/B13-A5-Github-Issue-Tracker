<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- Daisy UI and Tailwind -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-[#F8FAFC] flex items-center justify-center min-h-screen">
    <div class="card w-[520px] bg-white shadow-xl p-8">
      <!-- Logo -->
      <div class="flex justify-center mb-4">
        <img src="./assets/github-logo.png" alt="github-logo" class="w-14" />
      </div>

      <!-- Title bar -->
      <h1 class="text-2xl font-bold text-center">GitHub Issues Tracker</h1>
      <p class="text-center text-gray-500 mb-6">
        Sign in to manage your issues
      </p>

      <!-- User Name Part -->
      <div class="form-control mb-4">
        <label class="label">
          <span class="label-text font-medium">Username</span>
        </label>
        <input
          id="username"
          type="text"
          placeholder="Enter Username"
          class="input input-bordered w-full"
        />
        <p class="text-sm text-purple-600 mt-1">Default: admin</p>
      </div>

      <!-- Password part  -->
      <div class="form-control mb-4">
        <label class="label">
          <span class="label-text font-medium">Password</span>
        </label>
        <input
          id="password"
          type="password"
          placeholder="Enter Password"
          class="input input-bordered w-full"
        />
        <p class="text-sm text-purple-600 mt-1">Default: admin123</p>
      </div>

      <!-- Button For Sign In -->
      <button
        id="loginBtn"
        class="btn bg-linear-to-r from-purple-500 to-indigo-600 text-white border-none w-full"
      >
        Sign In
      </button>

      <!-- Demo Credentials -->
      <div class="bg-gray-100 p-4 rounded text-center text-sm">
        <p class="font-semibold mb-1">Demo Credentials:</p>
        <p>Username: admin</p>
        <p>Password: admin123</p>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
